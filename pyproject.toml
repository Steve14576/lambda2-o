[project]
name = "lambda2"
version = "0.1.0"
description = "Lambda² — Digital Life Consciousness Slice Reincarnation Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Lambda² Team"}]

dependencies = [
    "pipecat-ai[local]>=0.0.40",
    "litellm>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pedalboard>=0.9",
    "silero-vad>=5",
    "funasr>=1.1",
    "websockets>=12",
    "httpx>=0.27",
    "transitions>=0.9",
]

[project.optional-dependencies]
local-tts = [
    "cosyvoice @ git+https://github.com/FunAudioLLM/CosyVoice",
    "torch>=2.3",
    "torchaudio>=2.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
lambda2 = "lambda2.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
